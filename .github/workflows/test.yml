name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f

      - name: Shellcheck
        run: shellcheck scripts/*.sh test/*.sh

      - name: Capture / compare / verify
        run: bash test/vrt.test.sh "$RUNNER_TEMP/vrt"

      - name: Publish to the Pages branch
        run: bash test/publish-pages.test.sh "$RUNNER_TEMP/pages"

  # composite action として呼んだときに、撮影まで通ることを確かめる。
  # compare / baseline は gh-pages への push と PR コメントを伴うので、ここでは走らせない。
  action-capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run the action
        id: vrt
        uses: ./
        with:
          mode: capture
          build-command: node test/make-fixture.mjs base storybook-static
          output-dir: screenshots

      - name: Check screenshots
        env:
          SCREENSHOTS_DIR: ${{ steps.vrt.outputs.screenshots-dir }}
          RESULT: ${{ steps.vrt.outputs.result }}
        run: |
          set -euo pipefail
          test "$RESULT" = skipped
          test "$SCREENSHOTS_DIR" = "$GITHUB_WORKSPACE/screenshots"
          ls -l screenshots
          test "$(find screenshots -name '*.png' | wc -l)" -eq 3
          test -f screenshots/stories.json
          test -z "$(git status --porcelain -- . ':!screenshots' ':!storybook-static')"
